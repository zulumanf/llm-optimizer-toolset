name: CI

# paths-ignore: a push whose EVERY changed file matches is skipped entirely —
# docs-only and spec-only changes cannot break the build they don't touch.
# Any push mixing code with docs still runs the full suite.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "specs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "specs/**"

# One CI run per branch; a new push cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 15 stopped fitting on 2026-08-05: the suite grew past 1,400 tests and
    # the reversibility loop walks 57 migrations on a 2-core runner.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llm_optimizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests reset and re-migrate this database themselves.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/llm_optimizer_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/llm_optimizer_test
      AUTH_MODE: dev
      DEV_USER_EMAIL: ci@test.local
      DEV_USER_NAME: CI
      DEV_USER_ROLE: admin
      # No provider keys in CI on purpose: tests/setup.ts strips them anyway,
      # so a leaked key could never be spent by a test run.

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the migrations-changed check can diff against the
          # PR base / previous push (Actions diet, 2026-08-18).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Visible, non-blocking (spec 059): a blocking gate would freeze the
      # repo on unfixable transitive advisories (sharp/libvips via Next).
      # Dependabot files the fix PRs; this step keeps the state on every run.
      - name: Dependency audit (report)
        run: npm audit --audit-level=high || true

      # The full reversibility walk (all migrations down and back up on a
      # 2-core runner) grew into minutes of every run while migrations change
      # on a small minority of PRs. It now runs only when db/migrations/** or
      # the migrator itself changed — and runs unconditionally when the diff
      # base can't be resolved, so uncertainty fails toward checking.
      - name: Check whether migrations changed
        id: migrations
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "unknown diff base — running the reversibility check"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD -- db/migrations scripts/migrate.ts | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no migration changes since $BASE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrations apply cleanly
        run: npx tsx scripts/migrate.ts up --db "$TEST_DATABASE_URL"

      - name: Migrations reverse cleanly
        if: steps.migrations.outputs.changed == 'true'
        run: |
          # Every migration must roll back — historical reports depend on
          # being able to unwind a bad schema change (docs/09).
          for _ in $(seq 1 "$(ls db/migrations/*.sql | wc -l)"); do
            npx tsx scripts/migrate.ts down --db "$TEST_DATABASE_URL"
          done
          npx tsx scripts/migrate.ts up --db "$TEST_DATABASE_URL"

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Blocking as of 2026-08-05: the hang was execSync in playwright's
    # global setup blocking the event loop while createdb waited on a tty
    # password prompt (see tests/e2e/global-setup.ts). Green run:
    # 48/48 in 41s — actions/runs/30961209426.

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llm_optimizer_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The playwright config pins DATABASE_URL/AUTH_MODE/APP_URL itself;
      # this override matches the CI service credentials.
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5433/llm_optimizer_e2e

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Build (e2e dist)
        run: npx next build
        env:
          NEXT_DIST_DIR: .next-e2e
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/llm_optimizer_e2e
          AUTH_MODE: dev

      - name: UI/E2E suite (spec 049)
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The docker job moved to docker.yml (Actions diet, 2026-08-18): it only
  # runs when a Dockerfile, the dependency tree, or .dockerignore changes.
