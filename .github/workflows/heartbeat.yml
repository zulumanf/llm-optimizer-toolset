# Uptime check only (2026-08-17). The platform's clock moved into the
# always-on Railway worker (workers/index.ts ticks lib/ops/tick.ts every 10
# minutes), which is what the old 10-minute schedule here existed to fake.
# What remains is the one job an external vantage point genuinely does
# better: noticing the site is down. Every 30 minutes; the app check FAILS
# the workflow (GitHub emails on failure); the marketing root is report-only
# until its host is connected — flip it to strict by removing "|| true" once
# recommendedfirst.com serves.
#
# Requires repo secret APP_URL; exits quietly without it so the workflow can
# merge before a deploy exists. CRON_SECRET is no longer needed here.
name: heartbeat
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Uptime checks
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret unset — no deploy yet, exiting."
            exit 0
          fi
          echo "app health:"
          curl -sf --max-time 20 "$APP_URL/api/health" > /dev/null \
            && echo "  OK" || { echo "  DOWN"; exit 1; }
          echo "marketing root (report-only):"
          curl -s -o /dev/null --max-time 20 -w "  https://recommendedfirst.com -> %{http_code}\n" \
            https://recommendedfirst.com || true
