# Uptime check only (2026-08-17; throttled 2026-08-18). The platform's clock
# lives in the always-on Railway worker (workers/index.ts ticks
# lib/ops/tick.ts every 10 minutes) — nothing here drives the product.
#
# This exists solely as an external vantage point that notices the site is
# down and emails on failure. Every 6 hours is a compromise while it exists
# at all: the REAL fix is a free external uptime monitor (e.g. UptimeRobot,
# 5-minute checks at zero Actions cost) pointed at $APP_URL/api/health —
# once that is live, DELETE this workflow entirely.
#
# Requires repo secret APP_URL; exits quietly without it. The marketing root
# is report-only until its host is connected — flip it to strict by removing
# "|| true" once recommendedfirst.com serves.
name: heartbeat
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Uptime checks
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret unset — no deploy yet, exiting."
            exit 0
          fi
          echo "app health:"
          curl -sf --max-time 20 "$APP_URL/api/health" > /dev/null \
            && echo "  OK" || { echo "  DOWN"; exit 1; }
          echo "marketing root (report-only):"
          curl -s -o /dev/null --max-time 20 -w "  https://recommendedfirst.com -> %{http_code}\n" \
            https://recommendedfirst.com || true
